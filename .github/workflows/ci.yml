name: CI

on:
  pull_request:
  push:
    branches: [main]

# Новый запуск для той же ветки отменяет предыдущий, ещё не завершённый
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # нужно для публикации в GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          # setup-java создаёт ~/.m2/settings.xml с сервером github,
          # пароль берётся из переменной окружения GITHUB_TOKEN
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build and test
        if: github.event_name == 'pull_request'
        run: ./mvnw --batch-mode verify

      - name: Build, test and publish
        if: github.event_name == 'push'
        run: ./mvnw --batch-mode deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
